# .github/workflows/build.yaml
# Actions → Build Test IPA → Run workflow
#
# Do NOT use submodules: recursive (breaks on libass-android).

name: Build Test IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Production-optimized or fast validation build
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Release

permissions:
  contents: read

concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned full ${{ inputs.configuration }} IPA
    runs-on: macos-26
    # Release needs ~70–100 min on cold cache; Debug is faster.
    timeout-minutes: ${{ inputs.configuration == 'Release' && 240 || 60 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration }}
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          if [[ ! -d "${DEVELOPER_DIR}" ]]; then
            latest="$(ls -d /Applications/Xcode*.app/Contents/Developer 2>/dev/null | sort -V | tail -n 1 || true)"
            if [[ -n "${latest}" ]]; then
              echo "DEVELOPER_DIR=${latest}" >> "${GITHUB_ENV}"
              export DEVELOPER_DIR="${latest}"
            fi
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          java -version

      - name: Configure runtime properties
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
            sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            echo "No NUVIO_LOCAL_PROPERTIES_BASE64 secret — using empty local.properties"
            : > local.properties
          fi
          echo "local.properties size: $(wc -c < local.properties) bytes"

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      # Debug only: surface Kotlin errors early without doubling Release compile time.
      # Release skips this — xcodebuild already runs embedAndSignAppleFrameworkForXcode.
      - name: Preflight Kotlin iOS framework link
        if: inputs.configuration == 'Debug'
        id: kotlin_link
        run: |
          set -euo pipefail
          mkdir -p build/logs
          task=":composeApp:linkDebugFrameworkIosArm64"
          echo "Running ${task}"
          set +e
          env \
            "ORG_GRADLE_PROJECT_org.gradle.jvmargs=${NUVIO_GRADLE_JVMARGS}" \
            "ORG_GRADLE_PROJECT_kotlin.native.jvmArgs=${NUVIO_KOTLIN_NATIVE_JVMARGS}" \
            ./gradlew "${task}" --no-daemon --stacktrace \
            2>&1 | tee build/logs/kotlin-link.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "${status}" -ne 0 ]]; then
            {
              echo ""
              echo "============================================================"
              echo " KOTLIN LINK FAILED — error summary (scroll here)"
              echo "============================================================"
              echo ""
              grep -nE '^e: |^error: |FAILED|What went wrong:|Execution failed|OutOfMemory|Unresolved|Compilation error|A problem|Cannot |Could not |Exception|Caused by:' \
                build/logs/kotlin-link.log | tail -n 120 || true
              echo ""
              echo "------------------------------------------------------------"
              echo " Last 40 lines of kotlin-link.log:"
              echo "------------------------------------------------------------"
              tail -n 40 build/logs/kotlin-link.log || true
              echo ""
              echo "============================================================"
              echo " END ERROR SUMMARY — paste this block if asking for help"
              echo "============================================================"
            } | tee build/logs/kotlin-link-summary.txt
            {
              echo "## Kotlin link failed"
              echo ""
              echo '```'
              cat build/logs/kotlin-link-summary.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit "${status}"
          fi
          echo "Kotlin framework link OK"

      - name: Build unsigned full ${{ inputs.configuration }} IPA
        id: ipa_build
        run: |
          set -euo pipefail
          mkdir -p build/logs
          (
            while sleep 90; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat | head -n 12 || true
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 10 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          set +e
          ./scripts/build-ios-ipa.sh 2>&1 | tee build/logs/xcode-ipa.log
          status=${PIPESTATUS[0]}
          set -e
          kill "${monitor_pid}" 2>/dev/null || true
          if [[ "${status}" -ne 0 ]]; then
            {
              echo ""
              echo "============================================================"
              echo " XCODE / IPA BUILD FAILED — error summary (scroll here)"
              echo "============================================================"
              echo ""
              grep -nE 'error:|FAILED|BUILD FAILED|What went wrong:|Execution failed|Compile Kotlin|fatal error|OutOfMemory|undefined symbol|A problem' \
                build/logs/xcode-ipa.log | tail -n 120 || true
              echo ""
              echo "------------------------------------------------------------"
              echo " Last 80 lines of xcode-ipa.log:"
              echo "------------------------------------------------------------"
              tail -n 80 build/logs/xcode-ipa.log || true
              echo ""
              echo "============================================================"
              echo " END ERROR SUMMARY — paste this block if asking for help"
              echo "============================================================"
            } | tee build/logs/xcode-ipa-summary.txt
            {
              echo "## IPA build failed"
              echo ""
              echo '```'
              cat build/logs/xcode-ipa-summary.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit "${status}"
          fi

      - name: Summarize IPA
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi

          {
            echo "## Test IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Distribution: full"
            echo "- Configuration: ${IOS_CONFIGURATION}"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-test-${{ inputs.configuration }}-ipa-${{ github.sha }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.sha }}
          path: build/logs/**
          if-no-files-found: ignore
          retention-days: 3
